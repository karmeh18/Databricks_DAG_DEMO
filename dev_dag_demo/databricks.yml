# This is a Declarative Automation Bundle definition for dev_dag_demo.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: dev_dag_demo
  uuid: 8cddca41-a545-496e-ae7e-9d4a90474303

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-759a767a-f2d9.cloud.databricks.com
    variables:
      catalog: workspace
      schema: dev
  prod:
    mode: production
    workspace:
      host: https://dbc-759a767a-f2d9.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/mehtakaran5959@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/mehtakaran5959@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: workspace
      schema: prod
    permissions:
      - user_name: mehtakaran5959@gmail.com
        level: CAN_MANAGE
