# The main pipeline for dev_dag_demo

resources:
  pipelines:
    dev_dag_demo_etl:
      name: dev_dag_demo_etl
      catalog: ${var.catalog}
      schema: ${var.schema}
      serverless: true
      root_path: "../src/dev_dag_demo_etl"

      libraries:
        - glob:
            include: ../src/dev_dag_demo_etl/transformations/**

      environment:
        dependencies:
          # We include every dependency defined by pyproject.toml by defining an editable environment
          # that points to the folder where pyproject.toml is deployed.
          - --editable ${workspace.file_path}
